name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm install

      - name: Restore and upscale official app icon
        run: |
          cat assets/icon.b64.part1 assets/icon.b64.part2 assets/icon.b64.part3 | base64 -d > "$RUNNER_TEMP/app-icon-source.png"
          python3 -m pip install --quiet --user --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          import os
          src = Image.open(os.path.join(os.environ["RUNNER_TEMP"], "app-icon-source.png")).convert("RGB")
          src = src.resize((1024, 1024), Image.Resampling.LANCZOS)
          src = src.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=2))
          src.save("assets/app-icon.png", "PNG", optimize=False, compress_level=6)
          print("Official artwork restored and prepared at", src.size)
          PY
          file assets/app-icon.png | grep -q "PNG image data, 1024 x 1024"

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        env:
          CI: "1"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Find Android signing tools
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"

      - name: Create release test key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/treinocomuna-release.jks" \
            -alias treinocomuna \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "treinocomuna-build" \
            -keypass "treinocomuna-build" \
            -dname "CN=Treino Comuna, OU=AppsPlus, O=Treino Comuna, L=Belo Horizonte, ST=MG, C=BR"

      - name: Align and sign APK with Android v2/v3 schemes
        run: |
          SOURCE_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$SOURCE_APK"
          echo "Source APK: $SOURCE_APK"

          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$SOURCE_APK" "$RUNNER_TEMP/treinocomuna-aligned.apk"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/treinocomuna-release.jks" \
            --ks-key-alias treinocomuna \
            --ks-pass pass:treinocomuna-build \
            --key-pass pass:treinocomuna-build \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Treino-Comuna-Plus-v2.0.2.apk \
            "$RUNNER_TEMP/treinocomuna-aligned.apk"

      - name: Verify signature and package integrity
        run: |
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs Treino-Comuna-Plus-v2.0.2.apk
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 Treino-Comuna-Plus-v2.0.2.apk

          unzip -l Treino-Comuna-Plus-v2.0.2.apk | grep -q "assets/index.android.bundle"
          BUNDLE_SIZE="$(unzip -l Treino-Comuna-Plus-v2.0.2.apk assets/index.android.bundle | awk 'NR==4 {print $1}')"
          test "$BUNDLE_SIZE" -gt 100000
          echo "Embedded bundle size: $BUNDLE_SIZE bytes"

          AAPT="$BUILD_TOOLS_DIR/aapt"
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging Treino-Comuna-Plus-v2.0.2.apk | tee "$RUNNER_TEMP/badging.txt"
            grep -q "package: name='br.com.treinocomunamais.app'" "$RUNNER_TEMP/badging.txt"
            grep -q "application-label:'Treino Comuna+'" "$RUNNER_TEMP/badging.txt"
          fi

      - name: Smoke-check packaged JavaScript
        run: |
          unzip -p Treino-Comuna-Plus-v2.0.2.apk assets/index.android.bundle > "$RUNNER_TEMP/index.android.bundle"
          test -s "$RUNNER_TEMP/index.android.bundle"
          echo "JavaScript bundle present and readable."

      - name: Runtime smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r Treino-Comuna-Plus-v2.0.2.apk
            adb shell am force-stop br.com.treinocomunamais.app
            adb shell monkey -p br.com.treinocomunamais.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof br.com.treinocomunamais.app
            adb logcat -d > "$RUNNER_TEMP/runtime-logcat.txt"
            if grep -E "FATAL EXCEPTION|AndroidRuntime:.*Process: br.com.treinocomunamais.app|ReactNativeJS:.*(TypeError|ReferenceError|Invariant Violation)" "$RUNNER_TEMP/runtime-logcat.txt"; then
              echo "Runtime crash detected."
              tail -n 250 "$RUNNER_TEMP/runtime-logcat.txt"
              exit 1
            fi
            echo "Runtime launch test passed."

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Comuna-Plus-v2.0.2-runtime-log
          path: ${{ runner.temp }}/runtime-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: APK summary
        run: |
          ls -lh Treino-Comuna-Plus-v2.0.2.apk
          sha256sum Treino-Comuna-Plus-v2.0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Comuna-Plus-v2.0.2
          path: Treino-Comuna-Plus-v2.0.2.apk
          retention-days: 30
