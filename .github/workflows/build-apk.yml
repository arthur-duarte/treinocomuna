name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm install

      - name: Restore official app icon
        run: |
          cat assets/icon.b64.part1 assets/icon.b64.part2 assets/icon.b64.part3 | base64 -d > assets/app-icon.png
          echo "d89dd909e8eef7479a739676b83ac062295960c92ec2bf0f0107aa84627c8db9  assets/app-icon.png" | sha256sum -c -
          file assets/app-icon.png | grep -q "PNG image data, 128 x 128"
          echo "Official icon verified."

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        env:
          CI: "1"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Find Android signing tools
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"

      - name: Create release test key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/treinocomuna-release.jks" \
            -alias treinocomuna \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "treinocomuna-build" \
            -keypass "treinocomuna-build" \
            -dname "CN=Treino Comuna, OU=AppsPlus, O=Treino Comuna, L=Belo Horizonte, ST=MG, C=BR"

      - name: Align and sign APK with Android v2/v3 schemes
        run: |
          SOURCE_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$SOURCE_APK"
          echo "Source APK: $SOURCE_APK"

          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$SOURCE_APK" "$RUNNER_TEMP/treinocomuna-aligned.apk"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/treinocomuna-release.jks" \
            --ks-key-alias treinocomuna \
            --ks-pass pass:treinocomuna-build \
            --key-pass pass:treinocomuna-build \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Treino-Comuna-Plus-v0.2.0.apk \
            "$RUNNER_TEMP/treinocomuna-aligned.apk"

      - name: Verify signature and package integrity
        run: |
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs Treino-Comuna-Plus-v0.2.0.apk
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 Treino-Comuna-Plus-v0.2.0.apk

          unzip -l Treino-Comuna-Plus-v0.2.0.apk | grep -q "assets/index.android.bundle"
          BUNDLE_SIZE="$(unzip -l Treino-Comuna-Plus-v0.2.0.apk assets/index.android.bundle | awk 'NR==4 {print $1}')"
          test "$BUNDLE_SIZE" -gt 100000
          echo "Embedded bundle size: $BUNDLE_SIZE bytes"

          AAPT="$BUILD_TOOLS_DIR/aapt"
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging Treino-Comuna-Plus-v0.2.0.apk | tee "$RUNNER_TEMP/badging.txt"
            grep -q "package: name='br.com.treinocomunamais.app'" "$RUNNER_TEMP/badging.txt"
            grep -q "application-label:'Treino Comuna+'" "$RUNNER_TEMP/badging.txt"
          fi

      - name: Smoke-check packaged JavaScript
        run: |
          unzip -p Treino-Comuna-Plus-v0.2.0.apk assets/index.android.bundle > "$RUNNER_TEMP/index.android.bundle"
          test -s "$RUNNER_TEMP/index.android.bundle"
          echo "JavaScript bundle present and readable."

      - name: APK summary
        run: |
          ls -lh Treino-Comuna-Plus-v0.2.0.apk
          sha256sum Treino-Comuna-Plus-v0.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Comuna-Plus-v0.2.0
          path: Treino-Comuna-Plus-v0.2.0.apk
          retention-days: 30
