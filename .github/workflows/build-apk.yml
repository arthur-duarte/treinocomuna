name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm install

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        env:
          CI: "1"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Verify JavaScript bundle is embedded
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q "assets/index.android.bundle"
          echo "Standalone JS bundle confirmed inside APK."

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Treino-Comuna-Plus-v0.1.1.apk
          ls -lh Treino-Comuna-Plus-v0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Comuna-Plus-v0.1.1
          path: Treino-Comuna-Plus-v0.1.1.apk
          retention-days: 30
