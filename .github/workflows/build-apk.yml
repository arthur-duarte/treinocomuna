name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: |
          npm install
          npx expo install babel-preset-expo

      - name: Generate valid app artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import math
          s=1024
          im=Image.new("RGB",(s,s),(142,16,16))
          d=ImageDraw.Draw(im)
          cx=cy=s//2
          # revolutionary radial rays
          colors=[(178,24,24),(116,10,10)]
          for i in range(24):
              a1=2*math.pi*i/24
              a2=2*math.pi*(i+1)/24
              r=s*0.85
              pts=[(cx,cy),(cx+r*math.cos(a1),cy+r*math.sin(a1)),(cx+r*math.cos(a2),cy+r*math.sin(a2))]
              d.polygon(pts, fill=colors[i%2])
          # cream ring
          d.ellipse((160,140,864,844), outline=(247,230,190), width=62)
          # gold star
          pts=[]
          for i in range(10):
              a=-math.pi/2+i*math.pi/5
              r=112 if i%2==0 else 46
              pts.append((cx+r*math.cos(a),210+r*math.sin(a)))
          d.polygon(pts, fill=(224,168,44))
          # bar
          d.rounded_rectangle((150,460,874,555), radius=28, fill=(20,20,20))
          d.rounded_rectangle((245,486,779,529), radius=18, fill=(247,230,190))
          # plates
          for x in (120,810):
              d.rounded_rectangle((x,350,x+95,665), radius=28, fill=(18,18,18))
              d.rounded_rectangle((x+18,370,x+65,645), radius=16, fill=(224,168,44))
          for x in (72,875):
              d.rounded_rectangle((x,405,x+70,610), radius=22, fill=(18,18,18))
              d.rounded_rectangle((x+14,425,x+45,590), radius=12, fill=(224,168,44))
          # stylized clenched fist / forearm
          cream=(247,230,190); ink=(16,16,16)
          d.polygon([(425,430),(470,355),(535,340),(605,385),(620,475),(570,550),(555,700),(485,860),(425,760),(445,560),(390,500)], fill=cream)
          # black shadow facets
          d.polygon([(390,500),(445,560),(425,760),(360,900),(315,900),(360,610)], fill=ink)
          d.polygon([(520,548),(570,550),(555,700),(500,640)], fill=ink)
          # fingers
          for box in [(444,365,492,455),(495,350,545,450),(547,365,597,465)]:
              d.rounded_rectangle(box, radius=15, fill=cream, outline=ink, width=10)
          # wrist/star mark
          d.polygon([(462,500),(485,483),(508,500),(499,528),(471,528)], fill=ink)
          im.save("assets/app-icon.png","PNG",optimize=False,compress_level=6)
          print("Generated artwork:", im.size, im.mode)
          PY

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        env:
          CI: "1"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Verify JavaScript bundle is embedded
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q "assets/index.android.bundle"
          echo "Standalone JavaScript bundle confirmed inside APK."

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Treino-Comuna-Plus-v0.1.1.apk
          ls -lh Treino-Comuna-Plus-v0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Comuna-Plus-v0.1.1
          path: Treino-Comuna-Plus-v0.1.1.apk
          retention-days: 30
