name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm install

      - name: Normalize app artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          p = "assets/app-icon.png"
          im = Image.open(p).convert("RGB")
          im = im.resize((1024, 1024), Image.Resampling.LANCZOS)
          im.save(p, "PNG", optimize=False, compress_level=6)
          print("Artwork normalized:", im.size, im.mode)
          PY

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        env:
          CI: "1"
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Verify JavaScript bundle is embedded
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q "assets/index.android.bundle"
          echo "Standalone JavaScript bundle confirmed inside APK."

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Treino-Comuna-Plus-v0.1.1.apk
          ls -lh Treino-Comuna-Plus-v0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-Comuna-Plus-v0.1.1
          path: Treino-Comuna-Plus-v0.1.1.apk
          retention-days: 30
